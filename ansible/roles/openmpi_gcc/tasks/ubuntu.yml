---
- name: Install OpenMPI
  block:
    - name: Install OpenMPI prereqs
      ansible.builtin.apt:
        name: libiberty-dev
        state: present
        lock_timeout: 300

    - name: Clone UCX github repository
      ansible.builtin.git:
        repo: https://github.com/openucx/ucx.git
        dest: "/tmp/ucx-{{ ucx_version }}"
        clone: true
        update: true
        version: "{{ucx_version}}"
      when: ucx_version is defined

    - name: Configure and build UCX
      ansible.builtin.shell: >
        ./autogen.sh && \
        ./configure \
        {% if 'nvidia' in options %}--with-cuda=/usr/local/cuda{% endif %} \
        {% if 'amd' in options %}--with-rocm=/opt/rocm{% endif %} \
        --disable-logging --disable-debug --disable-assertions \
        --disable-params-check --with-rdmacm --with-verbs --with-mlx5 --enable-cma \
        --enable-examples --without-java --without-go --enable-mt \
        --without-xpmem --prefix=/opt/openmpi-{{ openmpi_version }} \
        && make -j$(nproc) \
        && make install
      args:
        chdir: "/tmp/ucx-{{ ucx_version }}"
        executable: /bin/bash
      when: ucx_version is defined

    - name: Clone UCC github repository
      ansible.builtin.git:
        repo: https://github.com/openucx/ucc.git
        dest: "/tmp/ucc-{{ ucc_version }}"
        clone: true
        update: true
        version: "{{ucc_version}}"
      when: ucc_version is defined
      register: git_clone_result
      retries: 5          # number of retry attempts
      delay: 30           # wait time (seconds) between retries
      until: git_clone_result is succeeded

    - name: Configure and build UCC
      ansible.builtin.shell: >
        ./autogen.sh && \
        ./configure \
        {% if 'nvidia' in options %}--with-cuda=/usr/local/cuda{% endif %} \
        {% if 'amd' in options %}--with-rocm=/opt/rocm --with-rocm-arch=all-arch-no-native{% endif %} \
        --with-ucx=/opt/openmpi-{{ openmpi_version }} \
        --prefix=/opt/openmpi-{{ openmpi_version }} \
        && make -j$(nproc) \
        && make install
      args:
        chdir: "/tmp/ucc-{{ ucc_version }}"
        executable: /bin/bash
      when: ucc_version is defined

    - name: Download and unpack OpenMPI
      ansible.builtin.unarchive:
        src: "https://download.open-mpi.org/release/open-mpi/v{{ openmpi_release }}/openmpi-{{ openmpi_version }}.tar.gz"
        dest: /tmp/
        remote_src: true

    - name: Check if hcoll is installed
      ansible.builtin.shell: dpkg -l hcoll
      register: hcoll_pkg_result
      ignore_errors: true

    - name: Check if hcoll.pc exists at custom path
      ansible.builtin.set_fact:
        hcoll_pc_path: "{{ install_prefix }}/{{ mellanox_hpcx_package }}/hcoll/lib/pkgconfig/hcoll.pc"
        hcoll_hpcx_base: "{{ install_prefix }}/{{ mellanox_hpcx_package }}"
      when: mellanox_hpcx_package is defined

    - name: Check if hcoll.pc exists at custom path
      ansible.builtin.stat:
        path: "{{ hcoll_pc_path }}"
      register: hcoll_pc_file
      when: mellanox_hpcx_package is defined

    - name: Update hcoll.pc to reflect true HPC-X install location
      ansible.builtin.replace:
        path: "{{ hcoll_pc_path }}"
        regexp: '^hpcx_home=.*$'
        replace: "hpcx_home={{ hcoll_hpcx_base }}"
      when: mellanox_hpcx_package is defined and hcoll_pkg_result != 0

    - name: Set with_hcoll_flag
      set_fact:
        with_hcoll_flag: >-
          {%- if hcoll_pkg_result.rc == 0 -%}--with-hcoll
          {%- elif mellanox_hpcx_package is defined and hcoll_pc_file is defined and hcoll_pc_file.stat.exists -%}--with-hcoll={{ hcoll_hpcx_base }}/hcoll
          {%- endif -%}
          
    - name: Configure and build OpenMPI
      ansible.builtin.shell: >
        ./configure --prefix=/opt/openmpi-{{ openmpi_version }} \
                    --with-ucx=/opt/openmpi-{{ openmpi_version }} \
                    {% if ucc_version is defined %}--with-ucc=/opt/openmpi-{{ openmpi_version }} {% endif %} \
                    {{ with_hcoll_flag | default('') | replace('\n','') | trim}} \
                    {% if 'nvidia' in options %}--with-cuda=/usr/local/cuda {% endif %} \
                    {% if 'amd' in options %}--with-rocm=/opt/rocm {% endif %} \
                    --enable-mpirun-prefix-by-default \
                    --with-platform=contrib/platform/mellanox/optimized \
                    --with-pmix --enable-ipv6 && make -j$(nproc) \
        && make install
      args:
        chdir: "/tmp/openmpi-{{ openmpi_version }}"
        executable: /bin/bash

    - name: Ensure directory exists
      ansible.builtin.file:
        path: /etc/environment-modules/modules/mpi/openmpi/
        state: directory
        mode: '0775'
        owner: ubuntu
        group: ubuntu
        recurse: true
        
    - name: Install OpenMPI module file
      ansible.builtin.template:
        src: templates/module.j2
        dest: "/etc/environment-modules/modules/mpi/openmpi/{{ openmpi_version }}-gcc"
        owner: root
        group: root
        mode: '0644'

    - name: Install OpenMPI shell files
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "/opt/openmpi-{{ openmpi_version }}/bin/{{ item.dest }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - { src: "templates/mpivars.sh.j2", dest: "mpivars.sh" }
        - { src: "templates/mpivars.csh.j2", dest: "mpivars.csh" }
