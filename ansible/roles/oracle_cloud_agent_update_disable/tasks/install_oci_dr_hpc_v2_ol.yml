---
- name: Install configured DrHPCv2 override on Oracle Linux
  when:
    - ansible_distribution == 'OracleLinux'
    - oci_dr_hpc_v2_version | default('', true) | string | length > 0
    - oci_dr_hpc_v2_version | default('default', true) | string | lower != 'default'
  block:
    - name: Download configured DrHPCv2 RPM
      ansible.builtin.get_url:
        url: "{{ oci_dr_hpc_v2_rpm_package_url }}"
        dest: "/tmp/oci-dr-hpc-v2_{{ oci_dr_hpc_v2_version }}-1_amd64.rpm"
        mode: '0644'

    - name: Remove OCA-provided DrHPCv2 package
      ansible.builtin.yum:
        name: oci-dr-hpc-v2
        state: absent

    - name: Install configured DrHPCv2 RPM
      ansible.builtin.yum:
        name: "/tmp/oci-dr-hpc-v2_{{ oci_dr_hpc_v2_version }}-1_amd64.rpm"
        state: present

    - name: Resolve configured DrHPCv2 binary path # noqa no-changed-when
      ansible.builtin.command: readlink -f /usr/bin/oci-dr-hpc-v2
      register: oci_dr_hpc_v2_binary_path
      changed_when: false

    - name: Configure OCA to use configured DrHPCv2 binary
      ansible.builtin.lineinfile:
        path: "{{ oci_dr_hpc_v2_config_path }}"
        regexp: '^binary_path:'
        line: "binary_path: {{ oci_dr_hpc_v2_binary_path.stdout }}"
        insertafter: EOF

    - name: Ensure OCA can access the DrHPCv2 installation directory
      ansible.builtin.file:
        path: /opt
        state: directory
        owner: root
        group: root
        mode: '0755'
