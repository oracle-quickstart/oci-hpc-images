---
- name: Install rccl tests
  block:
    - name: Select the RCCL installation used by tests
      ansible.builtin.set_fact:
        amd_rccl_home: >-
          {{ '/opt/rccl' if amd_rocm_version is version('7.2.4', '<') else '/opt/rocm' }}
        amd_rccl_tests_source_dir: /opt/rccl-tests

    - name: Build RCCL from source for ROCm older than 7.2.4
      block:
        - name: Clone rccl github repository
          ansible.builtin.git:
            repo: https://github.com/ROCm/rccl.git
            dest: /opt/rccl
            clone: true
            update: true
            version: "{{amd_rccl_commit}}"
          when:
            - amd_custom_rccl_anp_url | default('') | length == 0

        - name: Untar custom rccl anp package
          ansible.builtin.unarchive:
            src: "{{ amd_custom_rccl_anp_url }}"
            dest: "/tmp"
            remote_src: true
            creates: /tmp/rccl
          when:
            - amd_custom_rccl_anp_url | default('') | length > 0
    
        - name: Move custom rccl package
          ansible.builtin.copy:
            src: "/tmp/rccl"
            dest: "/opt"
            remote_src: true
          when:
            - amd_custom_rccl_anp_url | default('') | length > 0

        - name: Creates /opt/rccl/build directory
          ansible.builtin.file:
            path: /opt/rccl/build
            state: directory
            mode: "0755"

        - name: Install AMD RCCL dependencies
          ansible.builtin.apt:
            name:
              - libstdc++-12-dev
              - wget
              - gnupg
              - libdrm-dev
            lock_timeout: 300
          when: ansible_distribution == 'Ubuntu'

        - name: Install modern official CMake on Ubuntu 22
          block:
            - name: Download and store Kitware APT repository key
              ansible.builtin.get_url:
                url: https://apt.kitware.com/keys/kitware-archive-latest.asc
                dest: /etc/apt/trusted.gpg.d/kitware.asc
                mode: '0644'

            - name: Add Kitware APT repository
              ansible.builtin.apt_repository:
                repo: "deb https://apt.kitware.com/ubuntu/ {{ ansible_distribution_release }} main"
                state: present
                filename: kitware

            - name: Install Kitware CMake
              ansible.builtin.apt:
                name:
                  - cmake=3.31.8-0kitware1ubuntu22.04.1
                  - cmake-data=3.31.8-0kitware1ubuntu22.04.1
                state: latest
                lock_timeout: 300

            - name: Remove Kitware APT repository
              ansible.builtin.apt_repository:
                repo: "deb https://apt.kitware.com/ubuntu/ {{ ansible_distribution_release }} main"
                state: absent
                filename: kitware
          when:
            - ansible_distribution == 'Ubuntu'
            - ansible_distribution_major_version == '22'

        - name: Install CMake
          ansible.builtin.apt:
            name:
              - cmake
              - cmake-data
            state: latest
            lock_timeout: 300
          when:
            - ansible_distribution == 'Ubuntu'
            - ansible_distribution_major_version != '22'

        - name: Install AMD RCCL dependencies
          ansible.builtin.yum:
            name:
              - cmake
              - libstdc++-devel
              - libdrm-devel
          when: ansible_os_family == 'RedHat'

        - name: Run RCCL CMake # noqa no-changed-when
          ansible.builtin.shell: |
            cmake \
              -DCMAKE_PREFIX_PATH=/opt/rocm/ \
              -DCMAKE_CXX_COMPILER=/opt/rocm/bin/hipcc \
              -DCMAKE_CXX_FLAGS:STRING='-iquote /opt/rocm/include' \
              -B /opt/rccl/build \
              -S /opt/rccl

        - name: Build RCCL
          community.general.make:
            chdir: "/opt/rccl/build"
            jobs: "{{ ansible_processor_vcpus }}"
      when: amd_rocm_version is version('7.2.4', '<')

    - name: Verify packaged RCCL for ROCm 7.2.4 and newer
      block:
        - name: Check packaged RCCL library
          ansible.builtin.stat:
            path: /opt/rocm/lib/librccl.so
          register: amd_packaged_rccl_library

        - name: Ensure packaged RCCL library is available
          ansible.builtin.assert:
            that: amd_packaged_rccl_library.stat.exists
            fail_msg: >-
              ROCm {{ amd_rocm_version }} must provide /opt/rocm/lib/librccl.so
              before rccl-tests is built against the packaged RCCL installation.
      when: amd_rocm_version is version('7.2.4', '>=')

    - name: Build RCCL tests
      block:
        - name: Find matching directories
          ansible.builtin.find:
            paths: /usr/mpi/gcc/
            patterns: "openmpi*"
            file_type: directory
          register: openmpi_dirs
          when: "'openmpi' not in options"

        - name: Require a legacy OpenMPI installation
          ansible.builtin.assert:
            that: openmpi_dirs.files | length > 0
            fail_msg: "No OpenMPI installation found under /usr/mpi/gcc."
          when: "'openmpi' not in options"

        - name: Select OpenMPI for RCCL tests
          ansible.builtin.set_fact:
            amd_rccl_mpi_home: >-
              {{ '/opt/openmpi-' ~ openmpi_version
                 if 'openmpi' in options
                 else openmpi_dirs.files[0].path }}

        - name: Check the selected MPI compiler
          ansible.builtin.stat:
            path: "{{ amd_rccl_mpi_home }}/bin/mpicc"
            follow: true
          register: amd_rccl_mpicc

        - name: Require the selected MPI compiler
          ansible.builtin.assert:
            that: amd_rccl_mpicc.stat.exists
            fail_msg: >-
              Expected MPI compiler at {{ amd_rccl_mpi_home }}/bin/mpicc.

        - name: Clone RCCL tests
          ansible.builtin.git:
            repo: https://github.com/ROCm/rccl-tests.git
            dest: /opt/rccl-tests
            clone: true
            update: true
            version: 6405c76e6826663bbb67bd40aeee8c70aa5d3094

        - name: Create symlink from openmpi /lib64 to /lib as rccl test build expects /lib
          ansible.builtin.command:
            cmd: >-
              ln -s {{ amd_rccl_mpi_home }}/lib64
              {{ amd_rccl_mpi_home }}/lib
            creates: "{{ amd_rccl_mpi_home }}/lib"
          when: ansible_os_family == 'RedHat'

        - name: Make RCCL test
          community.general.make:
            chdir: "{{ amd_rccl_tests_source_dir }}"
            params:
              MPI=1
              MPI_HOME={{ amd_rccl_mpi_home }}
              NCCL_HOME={{ amd_rccl_home }}
              HIP_HOME=/opt/rocm
              ROCM_PATH=/opt/rocm
            jobs: "{{ ansible_processor_vcpus }}"
