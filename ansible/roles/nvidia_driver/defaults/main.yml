nvidia_driver_package_state: present
nvidia_driver_package_version: ''
nvidia_driver_persistence_mode_on: true
nvidia_driver_skip_reboot: true
nvidia_driver_module_file: /etc/modprobe.d/nvidia.conf
nvidia_driver_module_params:  |
  options nvidia NVreg_RestrictProfilingToAdminUsers=0
  options nvidia NVreg_EnableGpuFirmware=0
nvidia_driver_module_params_arm64:  |
  options nvidia NVreg_RestrictProfilingToAdminUsers=0
  options nvidia NVreg_CreateImexChannel0=1
  options nvidia NVreg_CoherentGPUMemoryMode=driver
  options nvidia NVreg_EnableGpuFirmware=0

nvidia_driver_add_repos: true
nvidia_driver_branch: "470"


##############################################################################
# RedHat family                                                              #
##############################################################################
epel_package: "https://dl.fedoraproject.org/pub/epel/epel-release-latest-{{ ansible_distribution_major_version }}.noarch.rpm"
epel_repo_key: "https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-{{ ansible_distribution_major_version }}"

nvidia_driver_rhel_branch: "{{ nvidia_driver_branch }}"

nvidia_repo_redhat_gpgkey: "D42D0685"
nvidia_driver_rhel_cuda_repo_baseurl: "https://developer.download.nvidia.com/compute/cuda/repos/{{ _rhel_repo_dir }}/"
nvidia_driver_rhel_cuda_repo_gpgkey: "https://developer.download.nvidia.com/compute/cuda/repos/{{ _rhel_repo_dir }}/{{ nvidia_repo_redhat_gpgkey }}.pub"

##############################################################################
# Ubuntu                                                                     #
##############################################################################

# Driver branch to install with Ubuntu
nvidia_driver_ubuntu_branch: "{{ nvidia_driver_branch }}"

# Determine if we should install from CUDA repo instead of Canonical repos
nvidia_driver_ubuntu_install_from_cuda_repo: true

# Base URLs and keys for NVIDIA repositories
nvidia_driver_ubuntu_cuda_repo_baseurl_x86: "https://developer.download.nvidia.com/compute/cuda/repos/{{ _ubuntu_repo_dir_x86 }}"
nvidia_driver_ubuntu_cuda_repo_baseurl_arm64: "https://developer.download.nvidia.com/compute/cuda/repos/{{ _ubuntu_repo_dir_arm64 }}"
nvidia_driver_ubuntu_cuda_repo_gpgkey_url_x86: "{{ nvidia_driver_ubuntu_cuda_repo_baseurl_x86 }}/3bf863cc.pub"
nvidia_driver_ubuntu_cuda_repo_gpgkey_url_arm64: "{{ nvidia_driver_ubuntu_cuda_repo_baseurl_arm64 }}/3bf863cc.pub"

# Installing with Canonical repositories
nvidia_driver_ubuntu_packages:
  - "nvidia-headless-{{ nvidia_driver_ubuntu_branch }}-server"
  - "nvidia-utils-{{ nvidia_driver_ubuntu_branch }}-server"
  - "nvidia-headless-no-dkms-{{ nvidia_driver_ubuntu_branch }}-server"
  - "nvidia-kernel-source-{{ nvidia_driver_ubuntu_branch }}-server"

nvidia_driver_ubuntu_open_additionnal_package_not_latest:
  - "nvidia-modprobe={{ nvidia_subversion_latest.stdout }}"
  - "nvidia-persistenced={{ nvidia_subversion_latest.stdout }}"

nvidia_driver_ubuntu_propr_additionnal_package_not_latest:
  - "nvidia-modprobe={{ nvidia_subversion_latest.stdout }}"

nvidia_driver_ubuntu_additionnal_package_not_latest: >-
  {{ (nvidia_driver_ubuntu_open_additionnal_package_not_latest is defined and nvidia_driver_open is defined and nvidia_driver_open) | ternary(nvidia_driver_ubuntu_open_additionnal_package_not_latest, nvidia_driver_ubuntu_propr_additionnal_package_not_latest) }}
  
# Installing with Cuda (open nvidia_driver_package_state:)
nvidia_driver_ubuntu_cuda_packages_open:
  - "nvidia-open"
  - "nvlink5"
  - "nvidia-imex"
  - "libnvidia-nscq"
  - "nvlsm"

nvidia_driver_ubuntu_cuda_packages_default:
  - "cuda-drivers-fabricmanager-{{ nvidia_driver_ubuntu_branch }}"
  - "libnvidia-nscq-{{ nvidia_driver_ubuntu_branch }}"

nvidia_driver_ubuntu_cuda_packages: >-
  {{ (nvidia_driver_open is defined and nvidia_driver_open) | ternary(nvidia_driver_ubuntu_cuda_packages_open, nvidia_driver_ubuntu_cuda_packages_default) }}
