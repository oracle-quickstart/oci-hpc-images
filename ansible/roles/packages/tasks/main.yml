---
- name: Validate packages_extra shape
  ansible.builtin.assert:
    that:
      - packages_extra is mapping and (packages_extra.keys() | difference(['ubuntu2204', 'ubuntu2404', 'ol8', 'ol9']) | length == 0)
    fail_msg: >-
      packages_extra must be a mapping keyed by ubuntu2204, ubuntu2404, ol8, and ol9.

- name: Select packages_extra entries for current OS
  ansible.builtin.set_fact:
    packages_extra_selected: >-
      {{
        (
          packages_extra.get(packages_extra_os_key, [])
        ) | default([], true)
      }}
  vars:
    packages_extra_os_key: >-
      {{
        'ubuntu2204' if ansible_distribution == 'Ubuntu' and ansible_distribution_major_version == '22'
        else 'ubuntu2404' if ansible_distribution == 'Ubuntu' and ansible_distribution_major_version == '24'
        else 'ol8' if ansible_os_family == 'RedHat' and ansible_distribution_major_version == '8'
        else 'ol9' if ansible_os_family == 'RedHat' and ansible_distribution_major_version == '9'
        else ''
      }}

- name: Validate selected packages_extra entries
  ansible.builtin.assert:
    that:
      - item is string or item is mapping
      - item is string or item.name is defined
      - item is string or item.version is not defined or item.version is string
    fail_msg: >-
      packages_extra entries must be a package name string or a mapping with
      name and optional string version keys.
  loop: "{{ packages_extra_selected }}"
  when: packages_extra_selected | length > 0

- name: Packages for RHEL based systems
  when:
    - ansible_os_family == 'RedHat'

  block:
    - name: microcode_ctl
      block:
        - name: Ensure latest microcode_ctl is installed
          ansible.builtin.yum:
            name:
              - microcode_ctl
            state: present
      rescue:
        - name: Add ol9_UEKR8 repository
          yum_repository:
            name: ol9_UEKR8
            description: Oracle Linux 9 UEK Release 8 (aarch64)
            baseurl: https://yum.oracle.com/repo/OracleLinux/OL9/UEKR8/aarch64/
            gpgkey: https://yum.oracle.com/RPM-GPG-KEY-oracle-ol9
            gpgcheck: yes
            enabled: yes
          when:
            - ansible_architecture == "aarch64"
            - ansible_distribution_major_version == '9'

        - name: Ensure DNF metadata is up to date
          dnf:
            update_cache: yes
          when:
            - ansible_architecture == "aarch64"
            - ansible_distribution_major_version == '9'

    - name: Ensure microcode_ctl is installed (optional)
      dnf:
        name: microcode_ctl
        state: present
      when: ansible_architecture == "aarch64"

    - name: Ensure dracut early_microcode="yes" is configured
      ansible.builtin.lineinfile:
        path: /usr/lib/dracut/dracut.conf.d/01-microcode.conf
        regexp: '^early_microcode='
        line: 'early_microcode="yes"'
        create: false
        state: present

    - name: Install development tools
      ansible.builtin.yum:
        enablerepo: "*developer_EPEL*"
        name:
          - "@Development Tools"
          - numactl
          - numactl-devel
          - libxml2
          - binutils-devel
          - environment-modules
          - python3-psutil
          - python3-distro
        state: present

    - name: Upgrade all packages # noqa package-latest
      ansible.builtin.yum:
        name: '*'
        state: latest
      when:
        - "options is defined"
        - "'upgrade' in options"

    - name: Install extra packages
      ansible.builtin.yum:
        name: >-
          {{
            item if item is string
            else item.name ~ ((item.version is defined) | ternary('-' ~ item.version, ''))
          }}
        state: present
      loop: "{{ packages_extra_selected }}"
      when: packages_extra_selected | length > 0

    - name: Reboot to install kernel updates
      ansible.builtin.reboot:
        reboot_timeout: 900
        post_reboot_delay: 30
      when:
        - (options is defined and ('upgrade' in options or 'rhck' in options)) or packages_extra_reboot | bool

- name: Packages for Ubuntu
  when:
    - ansible_distribution == 'Ubuntu'

  block:
    - name: Wait for automatic system updates to complete
      ansible.builtin.shell: while pgrep apt; do sleep 10; done;
      changed_when: false

    - name: Configure APT defaults
      ansible.builtin.copy:
        src: 99oci-hpc-apt
        dest: /etc/apt/apt.conf.d/99oci-hpc-apt
        owner: root
        group: root
        mode: '0644'

    - name: Disable unattended-upgrades
      ansible.builtin.systemd:
        name: unattended-upgrades
        enabled: false
        state: stopped
        masked: true

    - name: Remove unattended-upgrades
      ansible.builtin.apt:
        name: unattended-upgrades
        lock_timeout: 300
        state: absent

    - name: Update apt repo and cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0
        lock_timeout: 300

    - name: Update apt-get repo and cache
      ansible.builtin.apt:
        update_cache: true
        force_apt_get: true
        cache_valid_time: 0
        lock_timeout: 300

    - name: Upgrade all packages # noqa package-latest
      ansible.builtin.apt:
        name: '*'
        state: latest
        lock_timeout: 300
      when:
        - options is defined and 'upgrade' in options

    - name: Install CMake
      ansible.builtin.apt:
        name: cmake
        state: present
        lock_timeout: 300
    - name: Install python3-psutil
      ansible.builtin.apt:
        name: python3-psutil
        state: present
        lock_timeout: 300
    - name: Install python3-distro
      ansible.builtin.apt:
        name: python3-distro
        state: present
        lock_timeout: 300

    - name: Install extra packages
      ansible.builtin.apt:
        name: >-
          {{
            item if item is string
            else item.name ~ ((item.version is defined) | ternary('=' ~ item.version, ''))
          }}
        state: present
        lock_timeout: 300
      loop: "{{ packages_extra_selected }}"
      when: packages_extra_selected | length > 0

    - name: Reboot to install kernel updates
      ansible.builtin.reboot:
        reboot_timeout: 900
        post_reboot_delay: 30
      when:
        - (options is defined and 'upgrade' in options) or packages_extra_reboot | bool
