---
- name: Configure the requested Ubuntu kernel series
  when:
    - ansible_distribution == 'Ubuntu'
    - ansible_distribution_major_version in ['22', '24']
  block:
    - name: Select Ubuntu kernel series for this release
      ansible.builtin.set_fact:
        ubuntu_kernel_policy: >-
          {{ ubuntu_kernel.by_ubuntu_release[ansible_distribution_major_version] | default({}) }}

    - name: Validate Ubuntu kernel policy for this release
      ansible.builtin.assert:
        that:
          - ubuntu_kernel_policy is mapping
          - ubuntu_kernel_policy.series is defined
          - ubuntu_kernel_policy.flavor is defined
        fail_msg: >-
          ubuntu_kernel.by_ubuntu_release must define a policy for Ubuntu
          {{ ansible_distribution_major_version }}.

    - name: Set Ubuntu kernel policy facts
      ansible.builtin.set_fact:
        ubuntu_kernel_series: "{{ ubuntu_kernel_policy.series }}"
        ubuntu_kernel_flavor: "{{ ubuntu_kernel_policy.flavor }}"

    - name: Validate Ubuntu kernel policy
      ansible.builtin.assert:
        that:
          - ubuntu_kernel_series is match('^[0-9]+\\.[0-9]+$')
          - ubuntu_kernel_flavor in ['generic', 'oracle', 'nvidia', 'nvidia-64k']
        fail_msg: >-
          ubuntu_kernel must define a major.minor series and one of generic,
          oracle, nvidia, or nvidia-64k as its flavor.

    - name: Resolve the latest ABI in the requested kernel series
      ansible.builtin.shell: |
        set -o pipefail
        apt-cache pkgnames "linux-image-{{ ubuntu_kernel_series }}." |
          grep -E '^linux-image-{{ ubuntu_kernel_series | regex_escape }}\.[0-9]+-[0-9]+-{{ ubuntu_kernel_flavor | regex_escape }}$' |
          sort -V |
          tail -n 1
      args:
        executable: /bin/bash
      register: ubuntu_kernel_image_package
      changed_when: false

    - name: Fail when the requested Ubuntu kernel series is unavailable
      ansible.builtin.assert:
        that:
          - ubuntu_kernel_image_package.stdout != ''
        fail_msg: >-
          No {{ ubuntu_kernel_flavor }} kernel package is available for Ubuntu
          kernel series {{ ubuntu_kernel_series }}.

    - name: Derive the selected Ubuntu kernel ABI
      ansible.builtin.set_fact:
        ubuntu_kernel_abi: >-
          {{
            ubuntu_kernel_image_package.stdout
            | regex_replace('^linux-image-(.*)-' ~ ubuntu_kernel_flavor ~ '$', '\1')
          }}

    - name: Check whether matching extra modules are installable
      ansible.builtin.command:
        argv:
          - apt-get
          - --simulate
          - install
          - "linux-modules-extra-{{ ubuntu_kernel_abi }}-{{ ubuntu_kernel_flavor }}"
      register: ubuntu_kernel_extra_modules
      changed_when: false
      failed_when: false

    - name: Remove existing kernel packages
      ansible.builtin.apt:
        name:
          - linux-headers*
          - linux-image*
          - linux-modules-*
          - linux*headers*
          - linux*tools*
        state: absent
        purge: true
        autoremove: true
        lock_timeout: 300

    - name: Install the latest ABI in the requested kernel series
      ansible.builtin.apt:
        name:
          - "linux-image-{{ ubuntu_kernel_abi }}-{{ ubuntu_kernel_flavor }}"
          - "linux-headers-{{ ubuntu_kernel_abi }}-{{ ubuntu_kernel_flavor }}"
          - "linux-tools-{{ ubuntu_kernel_abi }}-{{ ubuntu_kernel_flavor }}"
          - "linux-modules-{{ ubuntu_kernel_abi }}-{{ ubuntu_kernel_flavor }}"
        state: present
        install_recommends: true
        lock_timeout: 300

    - name: Install matching extra modules when available
      ansible.builtin.apt:
        name: "linux-modules-extra-{{ ubuntu_kernel_abi }}-{{ ubuntu_kernel_flavor }}"
        state: present
        install_recommends: true
        lock_timeout: 300
      when: ubuntu_kernel_extra_modules.rc == 0

    - name: Pin kernel packages after selecting the ABI
      ansible.builtin.copy:
        content: |
          Package: linux-*
          Pin: version *
          Pin-Priority: -1
        dest: /etc/apt/preferences.d/00_pin_kernel
        mode: "0644"
      notify:
        - Reboot

    - name: Reboot into the selected Ubuntu kernel
      meta: flush_handlers

    - name: Refresh kernel facts after reboot
      ansible.builtin.setup:
        filter: ansible_kernel

    - name: Collect bootable Ubuntu kernel releases
      ansible.builtin.find:
        paths: /boot
        patterns: 'vmlinuz-*'
        file_type: file
        recurse: false
      register: ubuntu_kernel_bootable_releases

    - name: Check Ubuntu kernel package pin
      ansible.builtin.stat:
        path: /etc/apt/preferences.d/00_pin_kernel
      register: ubuntu_kernel_pin

    - name: Validate the selected Ubuntu kernel policy
      ansible.builtin.assert:
        that:
          - ansible_kernel is match('^' ~ (ubuntu_kernel_series | regex_escape) ~ '\\.')
          - ansible_kernel is match('^' ~ (ubuntu_kernel_abi | regex_escape) ~ '-')
          - >-
            ubuntu_kernel_bootable_releases.files
            | map(attribute='path')
            | map('basename')
            | reject('match', '^vmlinuz-' ~ (ubuntu_kernel_series | regex_escape) ~ '\\.')
            | list
            | length == 0
          - ubuntu_kernel_pin.stat.exists
        fail_msg: >-
          Expected Ubuntu kernel {{ ubuntu_kernel_abi }} from series
          {{ ubuntu_kernel_series }}, with no other bootable kernel series and
          /etc/apt/preferences.d/00_pin_kernel present; booted {{ ansible_kernel }}.
