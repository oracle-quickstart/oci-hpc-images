---
- name: Install perftest
  block:
    - name: Get the latest release tag from GitHub
      ansible.builtin.uri:
        url: "{{ perftest_repo | replace('.git', '') }}/releases/latest"
        return_content: true
      register: github_release
      when: perftest_version is not defined

    - name: Create perftest_version from latest
      ansible.builtin.set_fact:
        perftest_version: "{{ github_release.url | regex_replace('.*/', '') }}"
      when: perftest_version is not defined

    - name: Clone IB perftest
      ansible.builtin.git:
        repo: "{{ perftest_repo }}"
        dest: /tmp/perftest
        force: true
        version: "{{ perftest_version }}"

    - name: Autogen IB perftest # noqa no-changed-when
      ansible.builtin.command: ./autogen.sh
      args:
        chdir: /tmp/perftest

    - name: Configure IB perftest for GPUDirect # noqa no-changed-when
      ansible.builtin.command:
        cmd: >-
          ./configure --prefix={{ benchmark_base_path }}/perftest
          CUDA_H_PATH={{ cuda_home }}/include/cuda.h
          LDFLAGS=-Wl,--enable-new-dtags,-rpath,{{ cuda_home }}/lib64
      args:
        chdir: /tmp/perftest

    - name: make block
      block:
        - name: Build IB perftest
          community.general.make:
            chdir: /tmp/perftest
            jobs: "{{ ansible_processor_vcpus }}"
      rescue:
        - name: Build IB perftest (Needed on OL8)
          community.general.make:
            chdir: /tmp/perftest
            params:
              LD: g++
              LDFLAGS: "-L{{ cuda_home }}/lib64 -lstdc++ -lcudart -Wl,--enable-new-dtags,-rpath,{{ cuda_home }}/lib64"
            jobs: "{{ ansible_processor_vcpus }}"

    - name: Install IB perftest
      community.general.make:
        chdir: /tmp/perftest
        target: install

    - name: Install perftest license
      ansible.builtin.copy:
        src: /tmp/perftest/COPYING
        dest: "{{ benchmark_base_path }}/perftest/COPYING"
        remote_src: true
        owner: root
        group: root
        mode: "0644"

    - name: Remove perftest build directory
      ansible.builtin.file:
        path: /tmp/perftest
        state: absent
