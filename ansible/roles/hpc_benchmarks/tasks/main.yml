---
- name: Install OSU micro-benchmarks
  ansible.builtin.include_tasks: osu-micro-benchmarks.yml
  when: (options is defined) and ('openmpi' in options)

- name: Install NCCL tests
  ansible.builtin.include_tasks: nccl-tests.yml
  when: (options is defined) and ('nvidia' in options)

- name: Install GPUDirect-aware perftest
  ansible.builtin.include_tasks: perftest.yml
  when: (options is defined) and ('nvidia' in options)

