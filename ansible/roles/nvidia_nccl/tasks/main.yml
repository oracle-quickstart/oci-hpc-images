---
- name: Install from Cuda Repo
  block:
    - name: Install NCCL from CUDA repository for RHEL
      ansible.builtin.yum:
        name:
          - "libnccl-{{ nccl_package_version }}"
          - "libnccl-devel-{{ nccl_package_version }}"
          - "libnccl-static-{{ nccl_package_version }}"
        state: present
      environment: "{{ proxy_env if proxy_env is defined else {} }}"
      when:
        - ansible_os_family == 'RedHat'

    - name: Install NCCL from CUDA repository for Ubuntu
      ansible.builtin.apt:
        name:
          - "libnccl2={{ nccl_package_version }}"
          - "libnccl-dev={{ nccl_package_version }}"
        state: present
        lock_timeout: 300
      environment: "{{ proxy_env if proxy_env is defined else {} }}"
      when:
        - ansible_distribution == 'Ubuntu'
  rescue:
    - name: Install from Custom Repo
      block:
        - name: Set architecture for Arm
          ansible.builtin.set_fact:
            architecture: "arm64"
          when:
            - ansible_architecture == 'aarch64'

        - name: Set architecture for X86
          ansible.builtin.set_fact:
            architecture: "amd64"
          when:
            - ansible_architecture == 'x86_64'
            - ansible_distribution == 'Ubuntu'

        - name: Set architecture for X86
          ansible.builtin.set_fact:
            architecture: "x86_64"
          when:
            - ansible_architecture == 'x86_64'
            - ansible_os_family == 'RedHat'

        - name: Install NCCL from CUDA repository for Ubuntu
          ansible.builtin.apt:
            deb: "{{ item }}"
            state: present
            lock_timeout: 300
          with_items:
            - "{{ hpc_beta_download }}nccl/libnccl2_{{ nccl_package_version }}_{{ architecture }}.deb"
            - "{{ hpc_beta_download }}nccl/libnccl-dev_{{ nccl_package_version }}_{{ architecture }}.deb"
          environment: "{{ proxy_env if proxy_env is defined else {} }}"
          when: ansible_distribution == 'Ubuntu'

        - name: Install NCCL from CUDA repository for RHEL
          yum:
            name:
              - "{{ hpc_beta_download }}nccl/libnccl-{{ nccl_package_version }}.el{{ansible_distribution_major_version}}.{{architecture}}.rpm"
              - "{{ hpc_beta_download }}nccl/libnccl-devel-{{ nccl_package_version }}.el{{ansible_distribution_major_version}}.{{architecture}}.rpm"
              - "{{ hpc_beta_download }}nccl/libnccl-static-{{ nccl_package_version }}.el{{ansible_distribution_major_version}}.{{architecture}}.rpm"
            state: latest
            disable_gpg_check: true
          environment: "{{proxy_env if proxy_env is defined else {}}}"
          when:
            - ansible_os_family == 'RedHat'
        
      rescue:

        - name: Download NCCL source
          ansible.builtin.get_url:
            url: "https://github.com/NVIDIA/nccl/archive/refs/tags/v{{ nccl_version }}.tar.gz"
            dest: "/tmp/v{{ nccl_version }}.tar.gz"
            mode: '0644'

        - name: Extract NCCL tarball
          ansible.builtin.unarchive:
            src: "/tmp/v{{ nccl_version }}.tar.gz"
            dest: "/tmp"
            remote_src: yes

        - name: Install NCCL build dependencies on Debian/Ubuntu
          ansible.builtin.apt:
            name:
              - build-essential
              - devscripts
              - debhelper
              - fakeroot
            state: present
            update_cache: yes
          when: ansible_distribution == 'Ubuntu'

        - name: Build NCCL Debian package
          community.general.make:
            chdir: "/tmp/nccl-{{ nccl_version }}"
            target: "pkg.debian.build"
            jobs: "{{ ansible_processor_vcpus }}"
          when:
            - ansible_distribution == 'Ubuntu'

        - name: Install NCCL build dependencies on RedHat/CentOS/RHEL
          ansible.builtin.yum:
            name:
              - rpm-build
              - rpmdevtools
            state: present
          when: ansible_os_family == "RedHat"
          
        - name: Build NCCL Redhat package
          community.general.make:
            chdir: "/tmp/nccl-{{ nccl_version }}"
            target: "pkg.redhat.build"
            jobs: "{{ ansible_processor_vcpus }}"
          when: ansible_os_family == "RedHat"

        - name: Install NCCL from local build for Ubuntu
          ansible.builtin.apt:
            deb: "{{ item }}"
            state: present
            lock_timeout: 300
          with_items:
            - "/tmp/nccl-{{ nccl_version }}/build/pkg/deb/libnccl2_{{ nccl_package_version }}_{{ architecture }}.deb"
            - "/tmp/nccl-{{ nccl_version }}/build/pkg/deb/libnccl-dev_{{ nccl_package_version }}_{{ architecture }}.deb"
          when: ansible_distribution == 'Ubuntu'

        - name: Install NCCL from local build for RHEL
          ansible.builtin.yum:
            name:
              - "/tmp/nccl-{{ nccl_version }}/build/pkg/rpm/{{architecture}}/libnccl-{{ nccl_package_version }}.{{architecture}}.rpm"
              - "/tmp/nccl-{{ nccl_version }}/build/pkg/rpm/{{architecture}}/libnccl-devel-{{ nccl_package_version }}.{{architecture}}.rpm"
              - "/tmp/nccl-{{ nccl_version }}/build/pkg/rpm/{{architecture}}/libnccl-static-{{ nccl_package_version }}.{{architecture}}.rpm"
            state: latest
            disable_gpg_check: true
          when: ansible_os_family == "RedHat"

        - name: Remove NCCL source build artifacts without inspector
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "/tmp/nccl-{{ nccl_version }}"
            - "/tmp/v{{ nccl_version }}.tar.gz"
          when: "'monitoring' not in options"

- name: Install NCCL inspector plugin
  when: "'monitoring' in options"
  vars:
    nccl_inspector_base_version: "{{ nccl_version.split('-')[0] }}"
    nccl_inspector_ref: "v{{ nccl_inspector_base_version if nccl_inspector_base_version is version('2.31.2', '>=') else '2.31.2' }}-1"
    nccl_inspector_archive: "/tmp/{{ nccl_inspector_ref }}.tar.gz"
  block:
    - name: Check for NCCL source archive
      ansible.builtin.stat:
        path: "{{ nccl_inspector_archive }}"
      register: nccl_inspector_archive_stat

    - name: Download NCCL inspector source if NCCL used packages
      ansible.builtin.get_url:
        url: "https://github.com/NVIDIA/nccl/archive/refs/tags/{{ nccl_inspector_ref }}.tar.gz"
        dest: "{{ nccl_inspector_archive }}"
        mode: '0644'
      register: nccl_inspector_download
      until: nccl_inspector_download is success
      retries: 5
      delay: 10
      environment: "{{ proxy_env if proxy_env is defined else {} }}"
      when: not nccl_inspector_archive_stat.stat.exists

    - name: Remove stale NCCL inspector source directory
      ansible.builtin.file:
        path: /tmp/nccl-inspector-src
        state: absent

    - name: Create NCCL inspector source directory
      ansible.builtin.file:
        path: /tmp/nccl-inspector-src
        state: directory
        mode: '0755'

    - name: Extract NCCL inspector source
      ansible.builtin.unarchive:
        src: "{{ nccl_inspector_archive }}"
        dest: "/tmp/nccl-inspector-src"
        remote_src: yes
        extra_opts: [--strip-components=1]

    - name: Check NCCL inspector plugin source exists
      ansible.builtin.stat:
        path: /tmp/nccl-inspector-src/plugins/profiler/inspector
      register: nccl_inspector_dir

    - name: Fail if NCCL inspector plugin source not found
      ansible.builtin.fail:
        msg: "NCCL inspector directory not found in {{ nccl_inspector_ref }} - failing image build"
      when: not nccl_inspector_dir.stat.exists

    - name: Install NCCL inspector build dependencies on Ubuntu
      ansible.builtin.apt:
        name:
          - build-essential
        state: present
        lock_timeout: 300
      environment: "{{ proxy_env if proxy_env is defined else {} }}"
      when: ansible_distribution == 'Ubuntu'

    - name: Install NCCL inspector build dependencies on RHEL
      ansible.builtin.yum:
        name:
          - make
          - gcc-c++
        state: present
      environment: "{{ proxy_env if proxy_env is defined else {} }}"
      when: ansible_os_family == 'RedHat'

    - name: Build NCCL inspector plugin
      ansible.builtin.command: make
      args:
        chdir: /tmp/nccl-inspector-src/plugins/profiler/inspector
      changed_when: true

    - name: Find NCCL inspector library
      ansible.builtin.find:
        paths: /tmp/nccl-inspector-src/plugins/profiler/inspector
        patterns: "libnccl-profiler-inspector.so"
        file_type: file
      register: nccl_inspector_so

    - name: Fail if NCCL inspector build produced no library
      ansible.builtin.fail:
        msg: "NCCL inspector build produced no .so library - failing image build"
      when: nccl_inspector_so.files | length == 0

    - name: Install NCCL inspector library for Ubuntu
      ansible.builtin.copy:
        src: "{{ nccl_inspector_so.files[0].path }}"
        dest: "/usr/lib/{{ ansible_architecture }}-linux-gnu/libnccl-profiler-inspector.so"
        mode: '0644'
        remote_src: true
      when: ansible_distribution == 'Ubuntu'

    - name: Install NCCL inspector library for RHEL
      ansible.builtin.copy:
        src: "{{ nccl_inspector_so.files[0].path }}"
        dest: "/usr/lib64/libnccl-profiler-inspector.so"
        mode: '0644'
        remote_src: true
      when: ansible_os_family == 'RedHat'

    - name: Refresh linker cache
      ansible.builtin.command: ldconfig
      changed_when: true

    - name: Record NCCL inspector version for image manifest
      ansible.builtin.set_fact:
        nccl_inspector_version: "{{ nccl_inspector_ref }}"

    - name: Remove NCCL inspector build artifacts
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/nccl-inspector-src
        - "/tmp/nccl-{{ nccl_version }}"
        - "/tmp/v{{ nccl_version }}.tar.gz"
        - "{{ nccl_inspector_archive }}"
